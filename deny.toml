# Supply-chain policy (cargo-deny), checked in CI: known vulnerabilities,
# licences, banned crates and where dependencies may come from.
# See docs/security/supply-chain.md.

[graph]
all-features = true

[advisories]
# RustSec advisory database. Every exception needs a reason.
ignore = [
    # rustls-pemfile is unmaintained; only rumqttc's PEM-loading path uses
    # it, and OpenTrack hands rumqttc a ready rustls configuration instead.
    { id = "RUSTSEC-2025-0134", reason = "unused path in third_party/rumqttc" },
]

[licenses]
confidence-threshold = 0.9
# OpenTrack's own crates (publish = false) carry no licence field.
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The path dependencies inside this workspace have no version.
allow-wildcard-paths = true
deny = [
    # FIPS (docs/security/fips.md): no crypto outside the AWS-LC module.
    { crate = "ring", reason = "not FIPS-validated; use aws-lc-rs" },
    { crate = "openssl-src", reason = "OpenSSL comes from the OS, with its FIPS provider" },
    { crate = "native-tls", reason = "TLS is rustls with the AWS-LC FIPS provider" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
