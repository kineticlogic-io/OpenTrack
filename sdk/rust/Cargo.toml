# The Rust plugin SDK and its examples. Plugins build for WebAssembly:
#   cargo build --release --target wasm32-wasip2 -p example-tracker
[workspace]
resolver = "3"
members = ["opentrack-plugin", "examples/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[profile.release]
opt-level = "s"
lto = true
strip = true
