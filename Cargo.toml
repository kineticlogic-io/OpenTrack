[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/phornstein/OpenTrack"
rust-version = "1.90"

[workspace.dependencies]
ot-core = { path = "crates/ot-core" }
ot-store = { path = "crates/ot-store" }
ot-nats = { path = "crates/ot-nats" }
ot-source = { path = "crates/ot-source" }
ot-codec-stanag4607 = { path = "crates/ot-codec-stanag4607" }
anyhow = "1"
async-nats = "0.50"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
quick-xml = "0.42"
# Registry spreadsheets: xlsx out, xlsx/ods in, CSV both ways.
calamine = "0.36"
csv = "1"
rust_xlsxwriter = "0.99"
regex = "1"
rumqttc = "0.25"
# Named so the process can pick its TLS crypto provider (see ot-server main).
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
socket2 = "0.6"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager", "streams", "script"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "io-util"] }
tower-http = { version = "0.7", features = ["fs", "trace", "compression-gzip", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
