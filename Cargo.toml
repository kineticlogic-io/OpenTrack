[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/phornstein/OpenTrack"
rust-version = "1.90"

[workspace.dependencies]
ot-core = { path = "crates/ot-core" }
ot-store = { path = "crates/ot-store" }
ot-peat = { path = "crates/ot-peat" }
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
prost = "0.14"
protox = "0.9"
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager", "streams", "script"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower-http = { version = "0.7", features = ["fs", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
