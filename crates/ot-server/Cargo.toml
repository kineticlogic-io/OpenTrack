[package]
name = "ot-server"
description = "OpenTrack server: control plane API, NATS writer and operational commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "opentrack"
path = "src/main.rs"

[dependencies]
ot-core.workspace = true
ot-nats.workspace = true
ot-source.workspace = true
ot-plugin.workspace = true
ot-store.workspace = true
anyhow.workspace = true
argon2.workspace = true
jsonwebtoken.workspace = true
uuid.workspace = true
reqwest.workspace = true
futures-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tower.workspace = true
tokio-rustls.workspace = true
samael = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
url = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
bytes.workspace = true
calamine.workspace = true
csv.workspace = true
rust_xlsxwriter.workspace = true
rustls.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# SAML single sign-on; needs libxmlsec1. Leave it out for a lean node
# (`--no-default-features`): accounts, API tokens and OpenStare sign-in stay.
default = ["saml"]
saml = ["dep:samael", "dep:flate2", "dep:url", "dep:base64"]

[dev-dependencies]
http-body-util = "0.1"
rumqttc.workspace = true
tempfile.workspace = true

[lints]
workspace = true
