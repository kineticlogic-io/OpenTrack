# Runs OpenTrack beside Redis on the host network, publishing system tracks to
# the NATS server OpenStare runs. Settings and secrets come from `.env` next
# to this file (never committed); see the README for every OT_* variable.
services:
  opentrack:
    build: .
    image: opentrack:dev
    container_name: opentrack
    network_mode: host
    restart: unless-stopped
    command: ["all"]
    env_file: .env
    environment:
      OT_BIND: ${OT_BIND:-0.0.0.0:8090}
      OT_REDIS_URL: ${OT_REDIS_URL:-redis://127.0.0.1:6379}
      OT_NATS_URL: ${OT_NATS_URL:-nats://127.0.0.1:4222}
      OT_NATS_STREAM: ${OT_NATS_STREAM:-TRACKS}
      OT_NATS_TRACKS_SUBJECT: ${OT_NATS_TRACKS_SUBJECT:-tracks}
      OT_SITE_CODE: ${OT_SITE_CODE:-OTK}
      # Sign-in (see the README): the first admin, where browsers reach
      # OpenTrack (for SAML), and TLS with optional client certificates.
      OT_AUTH: ${OT_AUTH:-on}
      OT_ADMIN_EMAIL: ${OT_ADMIN_EMAIL:-}
      OT_ADMIN_PASSWORD: ${OT_ADMIN_PASSWORD:-}
      OT_SESSION_SECRET: ${OT_SESSION_SECRET:-}
      OT_PUBLIC_URL: ${OT_PUBLIC_URL:-}
      OT_TLS_CERT: ${OT_TLS_CERT:-}
      OT_TLS_KEY: ${OT_TLS_KEY:-}
      OT_TLS_CLIENT_CA: ${OT_TLS_CLIENT_CA:-}
      OT_LOG: ${OT_LOG:-info}
    volumes:
      # SQLite: sources, schema, registry, cards, decisions and the track graph.
      - ${OT_DATA_DIR:-./data}:/data

  # A local NATS with JetStream, for development only (`--profile dev-nats`).
  # In deployment OpenTrack connects to OpenStare's server instead.
  nats:
    image: nats:2
    profiles: ["dev-nats"]
    command: ["-js", "-sd", "/data"]
    network_mode: host
    volumes:
      - nats-data:/data

volumes:
  nats-data:
